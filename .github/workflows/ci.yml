name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python contracts
    runs-on: ubuntu-latest
    env:
      RELEASE_CONTRACT: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          checksum: 04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829
          enable-cache: true
          python-version: "3.14"
          version: "0.11.29"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          manifest_version="$(uv run python -c 'import json; print(json.load(open("custom_components/joyful_ble_positioning/manifest.json", encoding="utf-8"))["version"])')"
          test "${GITHUB_REF_NAME#v}" = "${manifest_version}"
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy custom_components/joyful_ble_positioning
      - name: Test
        run: uv run pytest -q

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The reviewed wrapper is commit-pinned, but it deliberately invokes the
      # mutable ghcr.io/hacs/action:main validator image in an isolated job.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # This pinned wrapper invokes an upstream-managed validator image; the
      # isolated hassfest job is intentionally not fully reproducible.
      - uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb
