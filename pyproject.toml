[project]
name = "joyful-ble-positioning"
version = "0.1.0"
description = "Admin-only BLE observation bridge for Home Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-homeassistant-custom-component==0.13.346",
    "ruff==0.15.22",
]

[tool.uv]
package = false
environments = ["python_full_version >= '3.14.2' and python_full_version < '3.15'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.joyful_ble_positioning"]

[tool.mypy]
python_version = "3.14"
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
